name: pulse
on:
  schedule:
    - cron: "*/5 12-22 * * 1-5"
    - cron: "7,37 0-11,23 * * *"
  workflow_dispatch:
concurrency:
  group: pulse
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - run: pip install -r requirements-agent.txt
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/run_and_publish.sh agent.run_pulse news.json live.json recs.json state.json status.json cik_map.json names.json
